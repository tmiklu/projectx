name: Create Release

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Dry run - Create Changelog to stdout'
        required: false
        type: boolean
      package:
        description: 'Which slug to release'
        type: choice
        options:
          - orchestrator
        default: orchestrator
  push:
    branches:
      - 'release/*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create the release
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Set git identity
        run: |
            git config --global user.email "tomas.miklusicak@cloudops.sk"
            git config --global user.name "tmiklu"
            
      - name: Ensure tags are present
        run: |
          git fetch --tags

      - name: Bump, Create Changelog and push with tags
        run: |
          DRY_RUN_BOOL="${{ inputs.dry-run }}"
          if [[ "$DRY_RUN_BOOL" == "true" ]]; then
            uv run cz bump --dry-run
          else
            uv run cz bump --yes
            git push --follow-tags
          fi

      - name: Create GitHub Release
        if: ${{ inputs.dry-run != true }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG=$(uv run cz version --project)
          grep "^## $TAG" CHANGELOG.md > release.md                                    
          awk "/## $TAG/{flag=1;next}/## [0-9]+/{flag=0}flag" CHANGELOG.md >> release.md
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release.md
