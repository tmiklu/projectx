name: Create Release

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Dry run - Create Changelog to stdout'
        required: false
        type: boolean
      package:
        description: 'Which slug to release'
        type: choice
        options:
          - orchestrator
          - evals
        default: orchestrator
      increment:
        description: 'Choose version bump strategy: AUTO (based on commits), or force MAJOR, MINOR or PATCH increment.'
        type: choice
        options:
          - AUTO
          - MAJOR
          - MINOR
          - PATCH
        default: AUTO
      validate-commit:
        description: 'Validate the latest N commit messages'
        type: number
        default: 0
  #push:
  #  branches:
  #    - 'release/*'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  GIT_AUTHOR_NAME: "projectx-ci-bot"
  GIT_COMMITTER_NAME: "projectx-ci-bot"
  EMAIL: "projectx-ci-bot@users.noreply.github.com"

jobs:    
  validate-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: "Validate commits to HEAD"
        if: ${{ inputs.validate-commit != 0 }}
        run: |
          cd "apps/${{ inputs.package }}"
          NUMBER_OF_COMMITS="HEAD~${{ inputs.validate-commit }}.."
          uv run cz check --rev-range $NUMBER_OF_COMMITS

      - name: Dry run output changelog to stdout
        if: "${{ inputs.dry-run == true }}"
        run: |
          cd "apps/${{ inputs.package }}"
          uv run cz bump --yes --dry-run
          
      - name: Output changelog to stdout
        if: "${{ inputs.dry-run == false }}"
        run: |
          INC=${{ inputs.increment }}
          cd "apps/${{ inputs.package }}"
          if [[ "$INC" == "AUTO" ]]; then
            echo AUTO
            uv run cz bump --yes --dry-run
          elif [[ -z "$INC" ]]; then
            uv run cz bump --yes --dry-run
          else
            uv run cz bump --increment "$INC" --dry-run
          fi

  release:
    if: ${{ inputs.dry-run == false }}
    runs-on: ubuntu-latest
    environment: release
    needs: validate-release
    steps:
      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.PROJECTX_CI_BOT_ID }}
          private-key: ${{ secrets.PROJECTX_CI_BOT_KEY }}

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.generate-token.outputs.token }}

      - name: install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Bump and Create Changelog
        run: |
          INC=${{ inputs.increment }}
          cd "apps/${{ inputs.package }}"
          if [[ "$INC" == "AUTO" ]]; then
            uv run cz bump --yes
          elif [[ -z "$INC" ]]; then
            uv run cz bump --yes
          else
            uv run cz bump --increment "$INC"
          fi

      - name: Push commits with tags
        run: | 
          git push && git push --tags

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          cd "apps/${{ inputs.package }}"
          TAG=$(uv run cz version --project)
          grep "^## $TAG" CHANGELOG.md > release.md                                    
          awk "/## $TAG/{flag=1;next}/## [0-9]+/{flag=0}flag" CHANGELOG.md >> release.md
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release.md
