name: Create Release

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Which slug to release"
        type: choice
        options:
          - orchestrator
        default: orchestrator
  push:
    branches:
      - release/\d+.\d+.\d+

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create the release
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Set git identity
        run: |
            git config --global user.email "tomas.miklusicak@cloudops.sk"
            git config --global user.name "tmiklu"
          
      - name: Bump and create Changelog
        run: |
          uv run cz bump --yes
          git add CHANGELOG.md
          git push

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG=$(uv run cz version --project)
          grep "^## $TAG" CHANGELOG.md > release.md                                    
          awk "/## $TAG/{flag=1;next}/## [0-9]+/{flag=0}flag" CHANGELOG.md >> release.md
          gh release create ${{ github.ref_name }} \
            --title "$TAG" \
            --notes-file release.md
