name: Create Release

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: >
          Run in dry-run mode and print the generated changelog to stdout.
        required: false
        default: true
        type: boolean
      package:
        description: >
          Select the package to release.
        type: choice
        options:
          - orchestrator
          - evals
        default: orchestrator
      increment:
        description: >
          Version bump strategy:
          AUTO detects the increment from commits,
          or explicitly force MAJOR, MINOR, or PATCH.
        type: choice
        options:
          - AUTO
          - MAJOR
          - MINOR
          - PATCH
        default: AUTO
      validate-commit:
        description: >
          Validate the latest N commit messages.
          Use 0 to skip validation.
        type: number
        default: 0

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: false

env:
  GIT_AUTHOR_NAME: "projectx-ci-bot[bot]"
  GIT_COMMITTER_NAME: "projectx-ci-bot[bot]"
  EMAIL: "projectx-ci-bot[bot]@users.noreply.github.com"
  CZ_BUMP: "uv run cz bump --yes"
  TMP_CHANGE_LOG: "changelog.tmp.md"
  INCREMENT_STRATEGY: "${{ inputs.increment }}"

defaults:
  run:
    shell: bash

jobs:    
  validate-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "apps/${{ inputs.package }}"
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          
      - name: install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: "Validate branch policy for hotfixes (prevent accidental minor bump)"
        if: ${{ startsWith(github.ref_name, 'release/') || startsWith(github.ref_name, 'fix/') }}
        run: |
          echo "Checking policy for branch: ${{ github.ref_name }} with strategy: $INCREMENT_STRATEGY"

          if [ "$INCREMENT_STRATEGY" = "auto" ]; then
            $CZ_BUMP --dry-run | tee $TMP_CHANGE_LOG
            DETECT_INCREMENT=$(grep -Eo 'MAJOR|MINOR|PATCH' $TMP_CHANGE_LOG)
            if [[ $DETECT_INCREMENT != 'PATCH' ]]; then
              echo "Detected increment is $DETECT_INCREMENT. Not allowed!"
              exit 1
            fi
          fi

      - name: "Validate commits to HEAD"
        if: ${{ inputs.validate-commit != 0 }}
        run: |
          NUMBER_OF_COMMITS="HEAD~${{ inputs.validate-commit }}.."
          uv run cz check --rev-range $NUMBER_OF_COMMITS

      - name: Output changelog to stdout
        run: |
          if [[ "$INCREMENT_STRATEGY" == "AUTO" || -z "$INCREMENT_STRATEGY" ]]; then
            echo "GET_NEXT=$($CZ_BUMP --get-next)" >> $GITHUB_ENV
            $CZ_BUMP --dry-run | tee $TMP_CHANGE_LOG
          else
            echo GET_NEXT=$($CZ_BUMP --get-next --increment "$INCREMENT_STRATEGY") >> $GITHUB_ENV
            $CZ_BUMP --increment "$INCREMENT_STRATEGY" --dry-run | tee $TMP_CHANGE_LOG
          fi

      - name: Check git tag collision
        run: |
          GET_TAG="release/${{ inputs.package }}/${{ env.GET_NEXT }}"
          
          if git --no-pager tag --list | grep -Fxq "$GET_TAG"; then
            echo "Git tag collision detected!"
            exit 1
          fi

          echo "No tag collision detected for $GET_TAG"

      - name: Upload changelog artifact
        uses: actions/upload-artifact@v7
        with:
          name: changelog-dry-run-${{ inputs.package }}.md
          path: "apps/${{ inputs.package }}/${{ env.TMP_CHANGE_LOG }}"

  release:
    if: ${{ inputs.dry-run == false }}
    defaults:
      run:
        working-directory: "apps/${{ inputs.package }}"
    runs-on: ubuntu-latest
    environment: release
    needs: validate-release
    steps:
      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.PROJECTX_CI_BOT_ID }}
          private-key: ${{ secrets.PROJECTX_CI_BOT_KEY }}

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.generate-token.outputs.token }}

      - name: install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Bump and Create Changelog
        run: |
          if [[ "$INCREMENT_STRATEGY" == "AUTO" || -z "$INCREMENT_STRATEGY" ]]; then
            echo "GET_NEXT=$($CZ_BUMP --get-next)" >> $GITHUB_ENV
            $CZ_BUMP | tee $TMP_CHANGE_LOG
            echo "DETECT_INCREMENT=$(grep -Eo 'MAJOR|MINOR|PATCH' $TMP_CHANGE_LOG)" >> $GITHUB_ENV
          else
            echo "GET_NEXT=$($CZ_BUMP --get-next --increment "$INCREMENT_STRATEGY")" >> $GITHUB_ENV
            echo "DETECT_INCREMENT=$INCREMENT_STRATEGY" >> $GITHUB_ENV
            $CZ_BUMP --increment "$INCREMENT_STRATEGY"
          fi

      - name: Push commits with tags
        run: |
          git push && git push --tags
          
      - name: Ensure release branch exists (minor/major only)
        if: ${{ env.DETECT_INCREMENT != 'PATCH' }}
        run: |
            RELEASE_X_TAG="$(echo $GET_NEXT | cut -d "." -f 1,2).x"
            RELEASE_BRANCH="release/${{ inputs.package }}/$RELEASE_X_TAG"
            echo "create release branch $RELEASE_BRANCH"
            git push origin origin/main:"refs/heads/$RELEASE_BRANCH"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          RELEASE_TAG="release/${{ inputs.package }}/$(uv run cz version --project)"
          RELEASE_NAME="${{ inputs.package }} $(uv run cz version --project)"

          awk "
            BEGIN { found=0 }
            \$0 ~ \"^## ${RELEASE_TAG}\" { found=1; next }
            found && \$0 ~ \"^## \" { exit }
            found { print }
          " CHANGELOG.md > release.md

          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_NAME" \
            --notes-file release.md
