name: Create Release

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Dry run - Create Changelog to stdout'
        required: false
        type: boolean
      package:
        description: 'Which slug to release'
        type: choice
        options:
          - orchestrator
        default: orchestrator
      increment:
        description: 'Choose version bump strategy: AUTO (based on commits), or force MAJOR, MINOR or PATCH increment.'
        type: choice
        options:
          - AUTO
          - MAJOR
          - MINOR
          - PATCH
        default: AUTO
  push:
    branches:
      - 'release/*'

jobs:
  init:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Set git identity
        run: |
            git config --global user.email "tomas.miklusicak@cloudops.sk"
            git config --global user.name "tmiklu"

      - name: Dry run changelog
        if: ${{ inputs.dry-run == true }}
        run: |
          INC=${{ inputs.increment }}
          if [[ "$INC" == "AUTO" ]]; then
            uv run cz bump --yes --dry-run
            uv run cz version --project
          else
            uv run cz bump --increment "$INC" --dry-run
            uv run cz version --project
          fi

  release:
    runs-on: ubuntu-latest
    environment: release
    needs: init
    permissions:
      contents: write
    steps:
      - name: install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Set git identity
        run: |
            git config --global user.email "tomas.miklusicak@cloudops.sk"
            git config --global user.name "tmiklu"

      - name: Bump and Create Changelog
        if: ${{ inputs.dry-run == false }}
        run: |
          INC=${{ inputs.increment }}
          if [[ "$INC" == "AUTO" ]]; then
            uv run cz bump --yes
          else:
            uv run cz bump --increment "$INC"
          fi

      - name: Push commits with tags
        if: ${{ inputs.dry-run == false }}
        run: | 
          git push && git push --tags

      - name: Create GitHub Release
        if: ${{ inputs.dry-run == false }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG=$(uv run cz version --project)
          grep "^## $TAG" CHANGELOG.md > release.md                                    
          awk "/## $TAG/{flag=1;next}/## [0-9]+/{flag=0}flag" CHANGELOG.md >> release.md
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release.md
