name: Create Release

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: >
          Run in dry-run mode and print the generated changelog to stdout.
        required: false
        type: boolean
      package:
        description: >
          Select the package to release.
        type: choice
        options:
          - orchestrator
          - evals
        default: orchestrator
      increment:
        description: >
          Version bump strategy:
          AUTO detects the increment from commits,
          or explicitly force MAJOR, MINOR, or PATCH.
        type: choice
        options:
          - AUTO
          - MAJOR
          - MINOR
          - PATCH
        default: AUTO
      validate-commit:
        description: >
          Validate the latest N commit messages.
          Use 0 to skip validation.
        type: number
        default: 0

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  GIT_AUTHOR_NAME: "projectx-ci-bot[bot]"
  GIT_COMMITTER_NAME: "projectx-ci-bot[bot]"
  EMAIL: "projectx-ci-bot[bot]@users.noreply.github.com"

jobs:    
  validate-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: "apps/${{ inputs.package }}"
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          
      - name: install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: "Validate commits to HEAD"
        if: ${{ inputs.validate-commit != 0 }}
        run: |
          NUMBER_OF_COMMITS="HEAD~${{ inputs.validate-commit }}.."
          uv run cz check --rev-range $NUMBER_OF_COMMITS

      - name: Output changelog to stdout
        if: "${{ inputs.dry-run == true }}"
        run: |
          echo "GET_NEXT=$(uv run cz bump --yes --get-next)" >> $GITHUB_ENV
          uv run cz bump --yes --dry-run | tee changelog-dry-run.md

      - name: Upload changelog artifact
        if: ${{ inputs.dry-run == true }}
        uses: actions/upload-artifact@v7
        with:
          name: changelog-dry-run-${{ inputs.package }}.md
          path: "apps/${{ inputs.package }}/changelog-dry-run.md"
          
      - name: Check git tag collision
        run: |
          git --no-pager tag | grep $GET_NEXT
          [[ $? -eq "0" ]] && exit 0 || echo "Git tag collision detected!" ; exit 1

  release:
    if: ${{ inputs.dry-run == false }}
    defaults:
      run:
        shell: bash
        working-directory: "apps/${{ inputs.package }}"
    runs-on: ubuntu-latest
    environment: release
    needs: validate-release
    steps:
      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.PROJECTX_CI_BOT_ID }}
          private-key: ${{ secrets.PROJECTX_CI_BOT_KEY }}

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.generate-token.outputs.token }}

      - name: install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Bump and Create Changelog
        run: |
          INC=${{ inputs.increment }}
          if [[ "$INC" == "AUTO" || -z "$INC" ]]; then
            uv run cz bump --yes | tee changelog.md
            echo "DETECT_INCREMENT=$(grep -Eo 'MAJOR|MINOR|PATCH' changelog.md)" >> $GITHUB_ENV
          else
            echo "DETECT_INCREMENT=$INC" >> $GITHUB_ENV
            uv run cz bump --yes --increment "$INC"
          fi

      - name: Push commits with tags
        run: |
          env
          git push && git push --tags
          
      - name: Ensure release branch exists (minor/major only)
        run: |
          if [[ $DETECT_INCREMENT == "MAJOR" || $DETECT_INCREMENT == "MINOR" ]]; then
            echo "create branch -> release/${{ inputs.package }}/$GET_NEXT"
            git checkout main ; git checkout -b "release/${{ inputs.package }}/$GET_NEXT"
            git status
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          TAG="release/${{ inputs.package }}/$(uv run cz version --project)"

          awk "
            BEGIN { found=0 }
            \$0 ~ \"^## ${TAG}\" { found=1; next }
            found && \$0 ~ \"^## \" { exit }
            found { print }
          " CHANGELOG.md > release.md

          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release.md
