name: Create Release

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Which slug to release"
        type: choice
        options:
          - orchestrator
        default: orchestrator
  push:
    branches:
      - 'release/*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create the release
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          
      - name: Bump and Change log
        run: |
          uv run cz bump --yes

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(uv run cz version --project)
          gh release create ${{ github.ref_name }} \
            --title "$TAG" \
            --notes-file CHANGELOG.md
